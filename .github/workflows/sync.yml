name: Sync from source repos

# The project folders are submodules. The source repos notify this repo
# (repository_dispatch) when their default branch changes; this bumps each
# submodule to its branch tip. The schedule is a fallback in case a notification is missed.
on:
  repository_dispatch:
    types: [source-updated]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Bump submodules and push
        run: |
          git submodule update --remote
          git diff --quiet && { echo "Already up to date"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Bump submodules: $(git diff --name-only | tr '\n' ' ')"
          git push origin HEAD:main
