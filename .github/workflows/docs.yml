name: Docs

# Builds the combined docs site from the project submodules and publishes it
# to GitHub Pages (Settings -> Pages -> Source:
# "GitHub Actions" must be enabled once).
#
# The sync workflow pushes with GITHUB_TOKEN, and pushes made that way don't
# trigger other workflows, so a `push` trigger alone would never rebuild when a
# project's docs change. workflow_run covers that: it fires whenever the sync
# finishes. The push trigger still covers hand edits to the root docs config.
on:
  workflow_run:
    workflows: ["Sync from source repos"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs
  cancel-in-progress: false

jobs:
  build:
    # A failed sync leaves the mirror unchanged; don't rebuild on top of it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || '' }}
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
